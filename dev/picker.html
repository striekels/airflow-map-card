<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>facade picker — dev harness</title>
    <style>
      :root {
        --primary-text-color: #212121;
        --secondary-text-color: #727272;
        --secondary-background-color: #e5e5e5;
        --divider-color: rgba(0, 0, 0, 0.12);
        --ha-card-background: #fff;
        --primary-color: #03a9f4;
        --error-color: #db4437;
        color-scheme: light;
      }
      body {
        font-family: Roboto, system-ui, sans-serif;
        margin: 0;
        padding: 24px;
        background: #f2f2f2;
        color: var(--primary-text-color);
      }
      .panel {
        width: 520px;
        max-width: 100%;
        background: #fff;
        border-radius: 12px;
        padding: 16px;
      }
      .out {
        font-family: ui-monospace, monospace;
        font-size: 12px;
        margin-top: 12px;
      }
      /* Stand-ins for HA elements the picker uses. */
      mwc-button {
        display: inline-block;
        padding: 6px 12px;
        border: 1px solid var(--primary-color);
        border-radius: 4px;
        color: var(--primary-color);
        cursor: pointer;
        font-size: 14px;
      }
      ha-alert {
        display: block;
        padding: 8px;
        border-radius: 4px;
        background: #e3f2fd;
        font-size: 13px;
      }
      ha-alert[alert-type='error'] {
        background: #fdecea;
      }
    </style>
  </head>
  <body>
    <h2>facade picker — dev harness</h2>
    <div class="panel">
      <div id="host"></div>
      <div class="out" id="out">bearing: (none yet)</div>
    </div>
    <script type="module">
      import '../src/editor/facade-picker.ts';

      const picker = document.createElement('airflow-facade-picker');
      picker.hass = { themes: { darkMode: false }, config: {} };
      picker.latitude = 51.059365;
      picker.longitude = 5.278536;
      picker.bearing = 0;
      picker.sidewaysFrom = 70;
      document.getElementById('host').appendChild(picker);

      picker.addEventListener('bearing-changed', (event) => {
        document.getElementById('out').textContent =
          'bearing-changed -> ' + event.detail.bearing + '°';
      });
    </script>
  </body>
</html>
