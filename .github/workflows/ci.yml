name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Least privilege. The repository default is already read-only, but a workflow
# that says so keeps working if that default is ever widened.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: node scripts/build.mjs

      - uses: actions/upload-artifact@v5
        with:
          name: airflow-map-card
          path: dist/airflow-map-card.js

  # Run on demand only. HACS looks for the built plugin in the repository root,
  # in dist/, or in a release; dist/ is deliberately not committed and releases
  # are cut by tag, so on an ordinary push there is nothing for it to validate
  # and it fails structurally. A permanently red CI teaches people to ignore it.
  #
  # Run this manually before submitting to the HACS default repository, and
  # after cutting a release.
  hacs:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Pinned to a commit, not a branch: `@main` runs whatever that
      # repository holds at the moment the job starts. The latest tagged
      # release is from 2022 and predates current HACS validation, so this
      # pins today's main instead. Bump it deliberately.
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-06-08
        with:
          category: plugin
